name: Build Smile Fingerprint APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android 15 SDK
      - name: Install SDK 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Find Android project
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLEW" ]; then
            ZIP=$(find . -maxdepth 2 -type f \
              -iname '*.zip' | head -n 1)

            if [ -z "$ZIP" ]; then
              echo "ERROR: No Gradle project or ZIP found."
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP" -d extracted

            GRADLEW=$(find extracted -type f \
              -name gradlew | head -n 1)
          fi

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      # 6. Build APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # 7. Check APK
      - name: Find Generated APK
        run: |
          find "$PROJECT_DIR" \
            -type f -name '*.apk'

          APK=$(find "$PROJECT_DIR" \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated: $APK"

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Smile-Fingerprint-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
